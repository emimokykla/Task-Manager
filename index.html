<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>

        <div class="input-row">
            <input type="text" id="taskInput" placeholder="Add a new task" aria-label="Task name">
            <button id="addTaskBtn" type="button">Add Task</button>
        </div>

        <ul id="taskList" aria-live="polite"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
